name: sbom

# Writes a CycloneDX software bill of materials for every published release and attaches it to the release,
# so that anyone who uses a version can see which components it was built from.
# Runs only when a release is published; it never publishes to npm and holds no secrets beyond the workflow token.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install exactly what the lockfile says, without running install scripts
        run: npm ci --ignore-scripts

      - name: Generate the SBOM from the installed tree
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Check that the file is a CycloneDX document
        run: node -e "const j=JSON.parse(require('fs').readFileSync('sbom.cdx.json','utf8')); if(j.bomFormat!=='CycloneDX') process.exit(1); console.log('components:', (j.components||[]).length)"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sbom.cdx.json --clobber

      - name: Keep as a build artifact when run by hand
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json
